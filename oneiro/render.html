<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>html,body{margin:0;background:transparent}canvas{width:1400px;height:1100px;display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { createClock } from './clock3d.js';
const q=new URLSearchParams(location.search);
const c=createClock(document.getElementById('c'),{preserve:true,pixelRatio:2,camX:+(q.get('x')||15)});
c.setTime(10,8,36); c.setGlow(+(q.get('g')||0.55)); if(q.get('rec')) c.setRecording(true);
c.render(); requestAnimationFrame(()=>{c.render(); window.done=true;});
</script></body></html>
